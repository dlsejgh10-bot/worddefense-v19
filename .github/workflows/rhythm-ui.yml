name: Rhythm UI browser check
on:
  push:
    branches: [ios]
    paths: ['scripts/cloud-ui-v59.cjs', 'WordDefense/Resources/www/weekend/pause-ui.css']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 scripts/verify_bundle.py
          python3 -m http.server 8766 --directory WordDefense/Resources/www/weekend > /tmp/ui-http.log 2>&1 &
          node scripts/cloud-ui-v59.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhythm-ui-v59
          path: ui-checks/
