name: Android practice APK
on:
  push:
    branches: [ios, merge-weekend-b169]
    paths: ['android-test/**', '.github/workflows/android-test.yml', 'WordDefense/Resources/www/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse the practice signing key for future APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: worddefense-practice-debug-key-v1
      - name: Build separate practice app
        run: |
          python3 scripts/verify_bundle.py
          cp -r WordDefense/Resources/www android-test/app/src/main/assets
          # b169: no practice test flag; the practice app follows production event rules
          cd android-test
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../WordDefense-Practice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WordDefense-Practice-APK
          path: WordDefense-Practice.apk
