name: Android practice APK
on:
  push:
    branches: [ios, merge-weekend-b169]
    paths: ['android-test/**', '.github/workflows/android-test.yml', 'WordDefense/Resources/www/**']
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Branch/commit to build (the run stays on this branch so the cached practice signing key is reused)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse the practice signing key for future APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: worddefense-practice-debug-key-v1
      - name: Make sure the practice signing key exists where Gradle reads it (so the cache can keep it)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          fi
      - name: Build separate practice app
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -i 'SHA-256' || true
          python3 scripts/verify_bundle.py
          cp -r WordDefense/Resources/www android-test/app/src/main/assets
          # b169: no practice test flag; the practice app follows production event rules
          cd android-test
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../WordDefense-Practice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WordDefense-Practice-APK
          path: WordDefense-Practice.apk
