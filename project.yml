name: WordDefense
options:
  bundleIdPrefix: com.wordgame
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release
  groupSortPosition: top
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.wordgame.worddefense
    PRODUCT_NAME: WordDefense
    MARKETING_VERSION: "1.0.34"
    CURRENT_PROJECT_VERSION: 56
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
packages:
  # Pin 9.2.0: 10.x needs Xcode 27, but GitHub macos-latest (Nov 2026) still defaults to Xcode 26.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"
  # b174 AdMob (rewarded). Ads stay off unless Firestore config/app ads.enabled is on.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.0.0"
targets:
  WordDefense:
    type: application
    platform: iOS
    sources:
      - path: WordDefense
        excludes:
          - Resources/www
          - Resources/www/**
      - path: WordDefense/Resources/www
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordgame.worddefense
        PRODUCT_NAME: WordDefense
        INFOPLIST_FILE: WordDefense/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 56
        MARKETING_VERSION: "1.0.34"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: WordDefense/WordDefense.entitlements
        ENABLE_PREVIEWS: "NO"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: WordDefense/Info.plist
      properties:
        CFBundleDisplayName: 단어 디펜스
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen:
          UIColorName: LaunchColor
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # b174 AdMob: Google sample (test) app ID until the real AdMob app exists. Real ads need the real app ID here.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        GADDelayAppMeasurementInit: true
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
