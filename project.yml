name: WordDefense
options:
  bundleIdPrefix: com.wordgame
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release
  groupSortPosition: top
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.wordgame.worddefense
    PRODUCT_NAME: WordDefense
    MARKETING_VERSION: "1.0.30"
    CURRENT_PROJECT_VERSION: 19
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
packages:
  # Pin 9.2.0: 10.x needs Xcode 27, but GitHub macos-latest (Nov 2026) still defaults to Xcode 26.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"
targets:
  WordDefense:
    type: application
    platform: iOS
    sources:
      - path: WordDefense
        excludes:
          - Resources/www
          - Resources/www/**
      - path: WordDefense/Resources/www
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: AuthenticationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordgame.worddefense
        PRODUCT_NAME: WordDefense
        INFOPLIST_FILE: WordDefense/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 19
        MARKETING_VERSION: "1.0.30"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: WordDefense/WordDefense.entitlements
        ENABLE_PREVIEWS: "NO"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: WordDefense/Info.plist
      properties:
        CFBundleDisplayName: 단어 디펜스
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen:
          UIColorName: LaunchColor
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: 719509438132-clf2cr9iplvq1nnipqdmpb94cju7dobh.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.wordgame.worddefense.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.719509438132-clf2cr9iplvq1nnipqdmpb94cju7dobh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSupportsIndirectInputEvents: true
    preBuildScripts:
      - name: Sync game HTML
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/sync_html.sh"
schemes:
  WordDefense:
    build:
      targets:
        WordDefense: all
    run:
      config: Debug
    archive:
      config: Release
